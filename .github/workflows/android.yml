name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: helios-android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Verify SDK installation
        shell: bash
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Build offline APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace --console=plain
      - name: Verify APK signature and embedded web application
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/HELIOS-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/HELIOS-android.apk
          unzip -p dist/HELIOS-android.apk assets/index.html | cmp - android/app/src/main/assets/index.html
          sha256sum dist/HELIOS-android.apk > dist/HELIOS-android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: HELIOS-android
          path: dist/
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="helios-android-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "HELIOS Android 2.0 — build ${GITHUB_RUN_NUMBER}" --notes "Offline Android APK. Debug-signed test build; not a Play Store production release. WebGL support depends on Android System WebView." --latest
          fi
